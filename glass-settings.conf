# Glass effect settings written to ~/.config/kwinrc, group [Effect-better-blur-dx], by install.sh.
# These are the dark-mode values; light mode has no dimming or dark gradient and a frosted top bar
# (GlassLumaCeiling 100, GlassShadeTop 0, ClearEdgeBars false), handled by macos-theme-toggle.
BlurStrength=5
DockBlurStrength=3
Brightness=95
Contrast=90
Saturation=160
RefractionMode=2
RefractionStrength=25
RefractionEdgeSize=2
RefractionCornerRadius=13
RefractionNormalPow=2
RefractionRGBFringing=0
GlassIor=150
GlassProfile=4
RimStrength=150
RimWidth=15
RimLightAngle=225
RimDirectionality=15
RimBackStrength=45
InnerShade=0
InnerShadeRadius=12
GlassCornerRadius=20
DockCornerRadius=20
GlassLumaCeiling=45
# application menus: smooth 10px corner cut and an even light edge line (needs the matching Kvantum menu frame, see README)
MenuCornerRadius=10
MenuEdgeLine=40
# popups and menus: dark along the top edge, clearing towards the bottom (percent of darkening, top / bottom)
GlassShadeTop=55
GlassShadeBottom=0
# the top bar: no blur, lens or rim, the wallpaper shows through it unchanged
ClearEdgeBars=true
